name: Verifier bug
description: The verifier gave the wrong verdict, crashed, or printed something it should not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove any secrets, internal host names or private paths from the receipts before pasting them.
  - type: textarea
    id: receipt
    attributes:
      label: Receipt or ledger
      description: The smallest receipt or ledger that shows the problem.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and the verifier's full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The verdict you expected, and how you know the system was in that state (what you checked, with which instrument).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and `python3 --version`.
    validations:
      required: true
