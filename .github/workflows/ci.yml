name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verifier and harness unit tests
        run: python -m unittest discover -s tests -v
      - name: Verifier help runs
        run: python scripts/verify_receipts.py --help
      - name: SKILL.md body is under 10,000 characters
        shell: python
        run: |
          import io, re, sys
          text = io.open("SKILL.md", encoding="utf-8").read()
          body = re.match(r"(?s)^---\n.*?\n---\n(.*)$", text).group(1)
          print("SKILL.md body:", len(body), "characters")
          sys.exit(0 if len(body) < 10000 else 1)
